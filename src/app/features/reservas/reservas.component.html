<app-page-header title="Reservas" subtitle="Reservas por fecha, hora, personas y mesa asignada.">
  <button mat-flat-button color="primary" (click)="nuevaReserva()">
    <mat-icon>add</mat-icon>
    Nueva reserva
  </button>
</app-page-header>

<div class="flex gap-2 mb-4">
  <button type="button" class="filter-chip" [class.filter-chip-active]="soloProximas()" (click)="soloProximas.set(true)">
    Próximas
  </button>
  <button type="button" class="filter-chip" [class.filter-chip-active]="!soloProximas()" (click)="soloProximas.set(false)">
    Todas
  </button>
</div>

<div class="card-surface overflow-hidden">
  @if (reservasMostradas().length === 0) {
    <app-empty-state icon="event_available" title="No hay reservas" message="Registra una nueva reserva para empezar."></app-empty-state>
  } @else {
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="reservasMostradas()" class="w-full">
        <ng-container matColumnDef="cliente">
          <th mat-header-cell *matHeaderCellDef>Cliente</th>
          <td mat-cell *matCellDef="let r">
            <p class="m-0 font-medium">{{ r.clienteNombre }}</p>
            <p class="m-0 text-xs text-stone-500">{{ r.telefono }}</p>
          </td>
        </ng-container>

        <ng-container matColumnDef="fechaHora">
          <th mat-header-cell *matHeaderCellDef>Fecha y hora</th>
          <td mat-cell *matCellDef="let r">{{ r.fecha }} · {{ r.hora }}</td>
        </ng-container>

        <ng-container matColumnDef="personas">
          <th mat-header-cell *matHeaderCellDef>Personas</th>
          <td mat-cell *matCellDef="let r">{{ r.personas }}</td>
        </ng-container>

        <ng-container matColumnDef="mesa">
          <th mat-header-cell *matHeaderCellDef>Mesa</th>
          <td mat-cell *matCellDef="let r">{{ r.numeroMesa ? 'Mesa ' + r.numeroMesa : 'Por asignar' }}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let r">
            <app-status-chip [label]="estadoInfo(r).label" [tone]="estadoInfo(r).tone"></app-status-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="text-right">Acciones</th>
          <td mat-cell *matCellDef="let r" class="text-right">
            @if (r.estado === 'pendiente') {
              <button mat-icon-button matTooltip="Confirmar" (click)="confirmar(r)">
                <mat-icon>check_circle</mat-icon>
              </button>
            }
            <button mat-icon-button matTooltip="Editar" (click)="editarReserva(r)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Cancelar" (click)="cancelar(r)">
              <mat-icon>close</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas"></tr>
      </table>
    </div>
  }
</div>
